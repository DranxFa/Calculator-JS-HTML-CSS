<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="calculator">
    <div id="display">0</div>
    <button id="delete=all"><p>AC</p></button>
    <button id="delete"><p>→</p></button>
    <button><p>/</p></button>
    <button><p>x</p></button>
    <button><p>7</p></button>
    <button><p>8</p></button>
    <button><p>9</p></button>
    <button><p>-</p></button>
    <button><p>6</p></button>
    <button><p>5</p></button>
    <button><p>4</p></button>
    <button><p>+</p></button>
    <button><p>1</p></button>
    <button><p>2</p></button>
    <button><p>3</p></button>
    <button id="equal"><p>=</p></button>
    <button id="zero"><p>0</p></button>
    <button><p>.</p></button>
  </div>
  <script src="app.js"></script>
</body>
</html>
